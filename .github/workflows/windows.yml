name: Windows x64 build
on:
  workflow_dispatch:
  push:
    paths: ['crates/**', 'vendor/**', 'Cargo.*', 'scripts/**', '.github/workflows/windows.yml']
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows executable
        run: cargo build --locked --release -p hx-app --target x86_64-pc-windows-msvc
      - name: Test portable core
        run: cargo test --locked -p hx-core -p hx-formats -p hx-enzymes -p hx-vienna
      - name: Package unsigned portable application
        run: python scripts/package-windows.py --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: AppimageGene-windows-x64-msvc
          path: dist/*.zip
          if-no-files-found: error
